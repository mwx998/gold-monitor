name: gold-monitor
on:
  schedule:
    - cron: '*/30 * * * *'   # 每30分钟一次
  workflow_dispatch:          # 支持手动触发
permissions:
  contents: write
concurrency:
  group: gold-monitor
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Fetch prices
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
        run: python gold_monitor.py
      - name: Commit state & report
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add gold_state.json history.json index.html
          git commit -m "update $(date -u +%FT%TZ)" || exit 0
          git push
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,*.py,gold_state.json,history.json'
